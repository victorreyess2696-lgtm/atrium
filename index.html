<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atrium · Consulta</title>
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atrium"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--arena:#f2f2f7;--panel:rgba(255,255,255,.72);--tinta:#1c1c1e;--tinta2:#5f5f66;--linea:rgba(60,60,67,.14);--oro:#ff9f0a;--verde:#34a56f;--azul:#0a7aff;--alerta:#ff3b30;--fill:rgba(120,120,128,.12);--sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;--serif:'Iowan Old Style','Georgia',serif;--r:26px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;background:var(--arena)}
body{background:
 radial-gradient(900px 600px at 8% -5%,rgba(10,122,255,.14),transparent 60%),
 radial-gradient(800px 600px at 100% 10%,rgba(52,199,89,.13),transparent 60%),
 radial-gradient(900px 700px at 60% 110%,rgba(255,159,10,.12),transparent 60%),var(--arena);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.banner{background:rgba(28,28,30,.9);color:#e5e5ea;font-size:11.5px;text-align:center;padding:6px 12px;letter-spacing:.02em}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 28px);gap:0}
.side{margin:14px 0 14px 14px;background:var(--panel);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.7);border-radius:32px;box-shadow:0 8px 32px rgba(0,0,0,.06);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:14px;height:calc(100vh - 56px)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 18px}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{font-size:11px;color:var(--tinta2);font-weight:500}
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;color:var(--tinta);text-align:left;width:100%;transition:.2s;font-weight:500}
.nav svg{width:21px;height:21px;flex:none;color:var(--azul)}
.nav:hover{background:var(--fill)}
.nav.on{background:rgba(10,122,255,.12);color:var(--azul);font-weight:600}
.side .foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--tinta2)}
main{padding:34px 40px 60px;max-width:1120px;width:100%;min-width:0}
h1{font-weight:700;font-size:36px;line-height:1.1;letter-spacing:-.03em;color:var(--tinta)}
h1 b{font-weight:700;background:linear-gradient(90deg,#0a7aff,#34c759);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-weight:650;font-size:20px;letter-spacing:-.015em}
.sub{color:var(--tinta2);margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.card{background:var(--panel);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);padding:22px;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--tinta2);font-weight:600;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--azul);color:#fff;font-size:14.5px;font-weight:600;transition:.2s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--fill);color:var(--azul)}
.btn.ghost:hover{background:rgba(120,120,128,.2);filter:none}
.btn.sm{padding:7px 15px;font-size:13.5px}
.btn.wa{background:#34c759;color:#fff}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--fill);color:var(--tinta2)}
.chip.ok{background:rgba(52,199,89,.15);color:#248a3d}
.chip.pend{background:rgba(255,159,10,.16);color:#b25e00}
.chip.red{background:rgba(255,59,48,.12);color:#d70015}
.tl{display:flex;flex-direction:column}
.ses{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--linea)}
.ses:first-child{border-top:0}
.ses .h{font-size:18px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ses .n{font-weight:600}
.ses .t{font-size:13px;color:var(--tinta2)}
.ses.now{background:rgba(10,122,255,.09);margin:2px -12px;padding:14px 12px;border-radius:20px;border-top-color:transparent}
.ses.now+.ses{border-top-color:transparent}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--linea)}
.item:first-of-type{border-top:0}
.item .txt{flex:1;font-size:14.5px;font-weight:500}
.item .txt small{display:block;color:var(--tinta2);font-size:12.5px;font-weight:400}
.dot{width:10px;height:10px;border-radius:50%;background:var(--oro);flex:none}
.dot.g{background:#34c759}.dot.r{background:var(--alerta)}
.alert{border-radius:22px;background:rgba(255,59,48,.1);border:1px solid rgba(255,59,48,.22);padding:15px 18px;display:flex;gap:12px;font-size:14px;align-items:center}
.alert b{color:#d70015}
.leaf{width:24px;height:24px;flex:none;border:1.8px solid rgba(60,60,67,.3);border-radius:50%;display:grid;place-items:center;transition:.2s}
.leaf.on{background:#34c759;border-color:#34c759}
.leaf.on::after{content:"";width:10px;height:5px;border-left:2.2px solid #fff;border-bottom:2.2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-top .m{font-size:22px;font-weight:700;letter-spacing:-.02em;text-transform:capitalize}
.arrows button{width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--azul);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{font-size:11px;font-weight:600;color:var(--tinta2);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1/0.92;border-radius:18px;padding:7px 9px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;font-weight:500}
.cal .d:hover{background:var(--fill)}
.cal .d.out{opacity:0}
.cal .d.hoy>span:first-child{color:var(--azul);font-weight:700}
.cal .d.sel{background:var(--azul);color:#fff}
.cal .d.sel>span:first-child{color:#fff}
.cal .d .dots{display:flex;gap:3px;flex-wrap:wrap}
.cal .d .dots i{width:6px;height:6px;border-radius:50%;background:var(--azul)}
.cal .d.sel .dots i{background:#fff}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:14px;padding:9px 14px;margin-bottom:10px}
.search input{border:0;background:none;outline:0;font:inherit;width:100%;color:var(--tinta)}
.plist{background:var(--panel);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.plist button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:18px;transition:.15s}
.plist button:hover{background:var(--fill)}
.plist button.on{background:rgba(10,122,255,.12)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#cfe3ff,#d8f5e2);display:grid;place-items:center;font-weight:700;font-size:16px;color:#245f9e;flex:none}
.plist small{color:var(--tinta2);font-size:12.5px;display:block}
.tabs{display:inline-flex;gap:2px;background:var(--fill);border-radius:14px;padding:3px;margin:18px 0;max-width:100%;overflow-x:auto}
.tabs button{padding:7px 15px;color:var(--tinta);border-radius:11px;white-space:nowrap;font-size:13.5px;font-weight:500}
.tabs button.on{background:#fff;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14.5px}
.kv dt{color:var(--tinta2)}
.note{background:rgba(120,120,128,.08);border-radius:18px;padding:12px 16px;margin:10px 0}
.note .d{font-size:12px;color:var(--tinta2);font-weight:600}
.note p{font-size:14.5px;margin-top:2px}
.note p b{font-weight:650}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.tcard p{font-size:14px;color:var(--tinta2);flex:1}
.paper{background:#fff;border-radius:18px;padding:42px 48px;max-width:640px;box-shadow:0 12px 40px rgba(0,0,0,.1);font-family:var(--serif)}
.paper .lh{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid #d1d1d6;margin-bottom:22px}
.paper .lh img{width:56px;height:56px;border-radius:50%}
.paper .lh b{font-size:20px;display:block}
.paper .lh small{font-family:var(--sans);font-size:10.5px;color:var(--tinta2);letter-spacing:.04em}
.paper p{font-size:14.5px;margin-bottom:12px;line-height:1.7}
.paper .sig{margin-top:6px;width:230px;border-top:1px solid var(--tinta);padding-top:6px;font-size:13px}
.paper .sigph{height:44px;width:160px;border:1.5px dashed #c7c7cc;border-radius:10px;display:grid;place-items:center;font-family:var(--sans);font-size:11px;color:var(--tinta2);margin-top:30px}
.docs{display:flex;flex-direction:column;gap:8px}
.docs button{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;text-align:left;background:var(--panel);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.75);transition:.15s}
.docs button svg{width:20px;height:20px;color:var(--azul);flex:none}
.docs button:hover{background:rgba(255,255,255,.95)}
.docs button.on{background:rgba(10,122,255,.12);color:var(--azul);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.modal{background:rgba(250,250,252,.92);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-radius:32px;padding:26px;width:100%;max-width:540px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal h2{margin-bottom:4px;font-size:24px;letter-spacing:-.02em}
label{display:block;font-size:12.5px;font-weight:600;color:var(--tinta2);margin:14px 0 6px 4px}
textarea,input.f,select.f{width:100%;border:0;background:var(--fill);border-radius:16px;padding:12px 16px;font:inherit;color:var(--tinta);outline:0;transition:.15s}
textarea:focus,input.f:focus,select.f:focus{background:#fff;box-shadow:0 0 0 3px rgba(10,122,255,.35)}
textarea{min-height:78px;resize:vertical}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tinta2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.bar{display:none}
.mob-only{display:none}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 main{padding:22px 16px 110px}
 h1{font-size:30px}
 .grid2,.split{grid-template-columns:minmax(0,1fr)!important}
 .cal .d{padding:4px 5px;border-radius:12px}
 .bar{display:flex;position:fixed;bottom:12px;left:12px;right:12px;background:rgba(255,255,255,.75);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 30px rgba(0,0,0,.14);border-radius:999px;padding:6px;z-index:40;justify-content:space-around}
 .bar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:500;color:var(--tinta2);padding:6px 4px;border-radius:999px;flex:1}
 .bar button svg{width:22px;height:22px}
 .bar button.on{color:var(--azul);background:rgba(10,122,255,.12);font-weight:600}
 .card{padding:18px}
 .ses.now{margin:2px -8px;padding:14px 8px}
 .paper{padding:26px 22px}
 .kv{grid-template-columns:105px 1fr}
 .mob-only{display:block}
 .split .plist-wrap.hide{display:none}
}
/* ===== LIQUID GLASS ===== */
:root{--glass:linear-gradient(135deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.22) 55%,rgba(255,255,255,.38) 100%);--glass-rim:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 1.5px 0 0 rgba(255,255,255,.55),inset -1px 0 0 rgba(255,255,255,.25),inset 0 0 22px rgba(255,255,255,.28);--glass-sh:0 14px 44px rgba(40,60,130,.14),0 2px 8px rgba(40,60,130,.06);--glass-bf:blur(22px) saturate(210%) brightness(1.06)}
body{background:#f1f2f6!important;background-attachment:fixed}
.orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;animation:flota 22s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:620px;height:620px;background:#dfe6f3;left:-160px;top:-160px}
.orbs i:nth-child(2){width:560px;height:560px;background:#ffffff;right:-100px;top:5%;animation-delay:-6s}
.orbs i:nth-child(3){width:600px;height:600px;background:#e4e8ef;left:30%;bottom:-260px;animation-delay:-11s}
.orbs i:nth-child(4){display:none}
@keyframes flota{to{transform:translate(70px,50px) scale(1.12)}}
@media(prefers-reduced-motion:reduce){.orbs i{animation:none}}
.banner,.app,.bar,.ov{position:relative;z-index:1}
.bar{position:fixed}.ov{position:fixed;z-index:50}
.side,.card,.plist,.docs button,.bar,.search,.tabs,.arrows button,.alert{position:relative}
.side,.card,.plist,.docs button,.bar{background:var(--glass)!important;backdrop-filter:var(--glass-bf)!important;-webkit-backdrop-filter:var(--glass-bf)!important;border:1px solid rgba(255,255,255,.5)!important;box-shadow:var(--glass-rim),var(--glass-sh)!important}
.side{position:sticky}.bar{position:fixed}
.card::before,.side::before,.plist::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 60% at 20% -10%,rgba(255,255,255,.55),transparent 55%)}
.card>*,.side>*,.plist>*{position:relative}
.modal{background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,255,255,.6))!important;backdrop-filter:blur(34px) saturate(210%)!important;-webkit-backdrop-filter:blur(34px) saturate(210%)!important;border:1px solid rgba(255,255,255,.7);box-shadow:var(--glass-rim),0 30px 80px rgba(20,30,80,.28)!important}
.nav.on,.plist button.on,.docs button.on{background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.45))!important;box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(10,122,255,.18)!important;color:var(--azul)}
.docs button.on{border-color:rgba(10,122,255,.35)!important}
.ses.now{background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.25));box-shadow:inset 0 1px 0 #fff,0 4px 16px rgba(10,122,255,.14)}
.btn{background:linear-gradient(180deg,#4a9bff,#0a7aff)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px rgba(10,122,255,.35)}
.btn.wa{background:linear-gradient(180deg,#5fdc82,#2fb957)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px rgba(52,199,89,.35)}
.btn.ghost{background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.3))!important;color:var(--azul);box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(40,60,130,.1)}
.search,.tabs{background:rgba(255,255,255,.38);box-shadow:inset 0 1px 2px rgba(40,60,130,.12),inset 0 -1px 0 rgba(255,255,255,.6)}
.tabs button.on{background:linear-gradient(135deg,#fff,rgba(255,255,255,.7));box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(40,60,130,.18)}
.arrows button{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.35));box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(40,60,130,.1)}
.cal .d.sel{background:linear-gradient(180deg,#4a9bff,#0a7aff);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(10,122,255,.4)}
.cal .d:hover{background:rgba(255,255,255,.5)}
.chip{background:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 #fff}
.chip.ok{background:rgba(52,199,89,.2)}.chip.pend{background:rgba(255,159,10,.22)}
.alert{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,59,48,.14))!important;border:1px solid rgba(255,255,255,.6)!important;backdrop-filter:var(--glass-bf);-webkit-backdrop-filter:var(--glass-bf);box-shadow:var(--glass-rim),0 8px 28px rgba(255,59,48,.14)}
.note{background:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.bar button.on{background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.5));box-shadow:inset 0 1px 0 #fff,0 3px 12px rgba(10,122,255,.2)}
.item,.ses{border-top-color:rgba(255,255,255,.55)}
.av{box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(40,60,130,.12)}
textarea,input.f,select.f{background:rgba(255,255,255,.55);box-shadow:inset 0 1px 3px rgba(40,60,130,.12)}
.apl{position:fixed;inset:0;z-index:60;background:#f1f2f6;display:none;overflow:auto}
.apl.on{display:block}
.apl-in{max-width:680px;margin:0 auto;padding:22px 18px 70px}
.apl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.prog{height:6px;border-radius:99px;background:rgba(60,60,67,.12);overflow:hidden;margin-bottom:26px}
.prog i{display:block;height:100%;background:var(--azul);border-radius:99px;transition:width .3s}
.inst{color:var(--tinta2);font-size:14px;margin-bottom:20px}
.qn{font-size:12.5px;font-weight:600;color:var(--azul)}
.q{font-size:26px;line-height:1.25;letter-spacing:-.02em;font-weight:650;margin:6px 0 22px}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.opt{padding:16px 20px;border-radius:20px;text-align:left;font-size:16px;font-weight:500;background:linear-gradient(135deg,#fff,rgba(255,255,255,.6));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(40,60,130,.1);transition:.15s}
.opt:hover{transform:translateY(-1px)}
.opt.on{background:linear-gradient(180deg,#4a9bff,#0a7aff);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(10,122,255,.35)}
.score{font-size:68px;font-weight:700;letter-spacing:-.04em;line-height:1.05}
.score small{font-size:22px;color:var(--tinta2);font-weight:500;letter-spacing:0}
.chip.big{font-size:14px;padding:6px 16px;margin-top:6px}
.dass{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.dass div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:20px;background:rgba(255,255,255,.5)}
.dass b{font-size:36px;letter-spacing:-.03em;line-height:1}
.dass span{font-size:13px;color:var(--tinta2);font-weight:600}
.dass em{font-style:normal;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;text-align:center}
@media print{body>*:not(.apl){display:none!important}.apl{position:static!important;background:#fff!important;overflow:visible}.noprint{display:none!important}.card{box-shadow:none!important;border:1px solid #ccc!important;background:#fff!important;backdrop-filter:none!important}}
h1 b{background:none!important;-webkit-text-fill-color:initial;color:var(--azul)}
.tools{display:flex;gap:6px;margin-bottom:10px}
.tool{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--tinta2);background:var(--fill);transition:.15s}

(function(){
 const C=window.ATRIUM||{};
 if(!C.clientId||!C.apiUrl||/PEGA/.test(C.clientId+C.apiUrl))return; // sin configurar → modo demostración
 const LS='atrium_tok';
 let tok=null,exp=0,esperando=[],ui=null,gisListo=false;
 const ahora=()=>Math.floor(Date.now()/1000);
 function parse(t){try{return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return null}}
 function guarda(t){const p=parse(t);if(!p)return;tok=t;exp=p.exp;try{localStorage.setItem(LS,t)}catch(e){}}
 try{const t=localStorage.getItem(LS);if(t){const p=parse(t);if(p&&p.exp-ahora()>120){tok=t;exp=p.exp}}}catch(e){}
 const valido=()=>tok&&exp-ahora()>60;
 function gis(cb){if(window.google&&google.accounts&&google.accounts.id){cb();return}let n=0;const i=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.id){clearInterval(i);cb()}else if(++n>60){clearInterval(i);msg('No se pudo cargar el inicio de sesión de Google. Revisa tu conexión o desactiva el bloqueador de contenido para este sitio.',true)}},150)}
 function msg(m,err){if(!ui)return;const e=ui.querySelector('#lg-msg');if(e){e.textContent=m;e.style.color=err?'#d70015':''}}
 function mostrar(m){
  if(!ui){ui=document.createElement('div');ui.className='lock on';ui.id='login';ui.style.zIndex=9999;
   ui.innerHTML=`<div class="lk" style="text-align:center"><img src="${(document.querySelector('.brand img')||{}).src||''}" alt="" style="width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:block"><h2>Atrium · Consulta</h2><p class="sub" id="lg-msg">Inicia sesión con tu cuenta de Google para abrir tu consultorio.</p><div id="lg-btn" style="display:flex;justify-content:center;margin-top:16px;min-height:44px"></div></div>`;
   document.body.appendChild(ui)}
  ui.style.display='';if(m)msg(m,true);
  gis(()=>{iniciaGIS();const b=ui.querySelector('#lg-btn');b.innerHTML='';google.accounts.id.renderButton(b,{theme:'outline',size:'large',text:'signin_with',shape:'pill',locale:'es',width:260})});
 }
 function iniciaGIS(){if(gisListo)return;gisListo=true;google.accounts.id.initialize({client_id:C.clientId,auto_select:true,cancel_on_tap_outside:false,callback:r=>{guarda(r.credential);if(ui)ui.style.display='none';const w=esperando;esperando=[];w.forEach(f=>f())}})}
 function sesion(forzar){
  return new Promise(res=>{
   if(!forzar&&valido()){res();return}
   esperando.push(res);if(esperando.length>1)return;
   const arranca=()=>{gis(()=>{iniciaGIS();try{google.accounts.id.prompt()}catch(e){}});setTimeout(()=>{if(esperando.length)mostrar()},forzar?0:2500)};
   if(document.body)arranca();else document.addEventListener('DOMContentLoaded',arranca);
  });
 }
 async function llamar(fn,args){
  await sesion(false);
  let j;
  try{const r=await fetch(C.apiUrl,{method:'POST',body:JSON.stringify({tok,fn,args}),redirect:'follow'});j=JSON.parse(await r.text())}
  catch(e){throw new Error('Sin conexión con el servidor. Revisa tu internet o que la implementación esté publicada como «Nueva versión».')}
  if(j.ok)return j.r;
  if(/^AUTH/.test(j.error||'')){tok=null;exp=0;try{localStorage.removeItem(LS)}catch(e){}
   try{google.accounts.id.disableAutoSelect()}catch(e){}
   const p=sesion(true);mostrar(j.error.replace(/^AUTH:\s*/,''));await p;return llamar(fn,args)}
  throw new Error((j.error||'Error del servidor').replace(/^AUTH:\s*/,''));
 }
 function runner(ok,fail){return new Proxy({},{get(_,n){
  if(n==='withSuccessHandler')return f=>runner(f,fail);
  if(n==='withFailureHandler')return f=>runner(ok,f);
  if(typeof n!=='string'||n==='then')return undefined;
  return (...a)=>{llamar(n,a).then(r=>ok&&ok(r)).catch(e=>fail?fail(e):console.error(e))}}})}
 window.ATRIUM_RUN=runner();
 window.cerrarSesionGoogle=function(){tok=null;exp=0;try{localStorage.removeItem(LS)}catch(e){};try{google.accounts.id.disableAutoSelect()}catch(e){};location.reload()};
 if(!valido())document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{if(!valido())sesion(false)},0));
})();

const nivelDe=(T,s)=>T.bands?T.bands.find(b=>s>=b[0]&&s<=b[1]):null;
function calcRes(T,r){
 let s,nivel='',color='#8e8e93',det=null;
 if(T.sub3){det=T.sub3.map(([n,idx,bs])=>{const v=2*idx.reduce((a,i)=>a+r[i],0);const b=bs.find(x=>v>=x[0]&&v<=x[1]);const c=['#34c759','#ffcc00','#ff9500','#ff6a3d','#ff3b30'][bs.indexOf(b)];return [n,v,b[2],c]});s=det.reduce((a,d)=>a+d[1],0);nivel=det.map(d=>d[0].slice(0,3)+'. '+d[2].toLowerCase()).join(' · ')}
 else if(T.detf){det=T.detf(r,T);s=det.reduce((a,d)=>a+d[1],0);nivel=det.map(d=>d[0]+': '+d[2]).join(' · ')}
 else{s=T.calc?T.calc(r,T):sum(r);const b=nivelDe(T,s);if(b){nivel=b[2];color=b[3]}}
 return {s,nivel,color,det,flag:T.sens?T.sens(r):null};
}

function aplRender(){

 if(A.i<n){
  h=`<div class="apl-top noprint"><button class="btn ghost sm" onclick="aplClose()">✕ Salir</button><span class="sub">${A.p.n} · ${T.titulo}</span></div>

   ${T.multi?'':`<div class="score">${R.s}<small> / ${T.max}</small></div><span class="chip big" style="background:${R.color}2e;color:#1c1c1e;border:1px solid ${R.color}">${R.nivel}</span>`}

  ${R.flag?`<div class="alert" style="margin-top:14px"><span style="font-size:22px">⚠️</span><div><b>Atención clínica.</b> ${R.flag}</div><button class="btn sm noprint" style="margin-left:auto" onclick="abrirPlan()">Plan de seguridad</button></div>`:''}
  <div class="card" style="margin-top:14px"><div class="eyebrow">Respuestas</div>${T.items.map((it,i)=>`<div class="item"><div class="txt">${i+1}. ${it}<small>${escOf(T,i).find(o=>o[0]===A.r[i])[1]}</small></div></div>`).join('')}</div>

 }

function chartT(T,rs){
 const W=520,H=210,L=34,B=28,T0=10,lo=T.min,hi=T.max,ys=v=>T0+(H-T0-B)*(1-(v-lo)/(hi-lo)),xs=i=>rs.length==1?L+240:L+(W-L-20)*i/(rs.length-1);
 let g=T.bands.map(b=>{const top=ys(Math.min(b[1]+1,hi)),bot=ys(b[0]);return `<rect x="${L}" y="${top}" width="${W-L-10}" height="${bot-top}" fill="${b[3]}" opacity=".16"/><text x="${L-8}" y="${bot+4}" font-size="10" fill="#8e8e93" text-anchor="end">${b[0]}</text>`}).join('');
 const pts=rs.map((x,i)=>[xs(i),ys(x.s)]);
 g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#0a7aff" stroke-width="3" stroke-linejoin="round"/>`;
 g+=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="#0a7aff" stroke-width="2"/><text x="${p[0]}" y="${p[1]-11}" font-size="11" text-anchor="middle" style="fill:var(--tinta)" font-weight="600">${rs[i].s}</text><text x="${p[0]}" y="${H-8}" font-size="10" text-anchor="middle" fill="#8e8e93">${rs[i].f}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="legend">${T.bands.map(b=>`<span><i style="background:${b[3]}"></i>${b[2]}</span>`).join('')}</div>`;
}
function pruebasTab(p){

 const html=Object.keys(gr).map(id=>{const T=TESTS[id],rs=gr[id],l=rs[rs.length-1];
  return `<div class="eyebrow" style="margin-top:14px">${T.titulo} · ${T.sub}</div>`+(T.bands&&T.bands.length&&!T.multi?chartT(T,rs):'')+
  (T.multi?rs.map(x=>`<div class="note"><div class="d">${x.f}</div><p>${x.det.map(d=>`<b>${d[0]}</b> ${d[1]} (${d[2]})`).join(' · ')}</p></div>`).join(''):`<p class="sub" style="font-size:13px;margin-top:8px">Última: ${l.s} pts · ${l.nivel}. ${T.nota}</p>`)}).join('');

function gadChart(v,f){
 const W=520,H=210,L=34,B=28,T=10,max=21,ys=y=>T+(H-T-B)*(1-y/max),xs=i=>v.length==1?L+240:L+(W-L-20)*i/(v.length-1);
 const bands=[[0,4,'#34c759','Mínima'],[5,9,'#ffcc00','Leve'],[10,14,'#ff9500','Moderada'],[15,21,'#ff3b30','Grave']];
 let g=bands.map(b=>`<rect x="${L}" y="${ys(b[1]+1>21?21:b[1]+1)}" width="${W-L-10}" height="${ys(b[0])-ys(b[1]+1>21?21:b[1]+1)}" fill="${b[2]}" opacity=".16"/>`).join('');
 g+=[0,5,10,15,21].map(t=>`<text x="${L-8}" y="${ys(t)+4}" font-size="10" fill="#8e8e93" text-anchor="end">${t}</text>`).join('');
 const pts=v.map((p,i)=>[xs(i),ys(p)]);
 g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#0a7aff" stroke-width="3" stroke-linejoin="round"/>`;
 g+=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="#0a7aff" stroke-width="2"/><text x="${p[0]}" y="${p[1]-11}" font-size="11" text-anchor="middle" style="fill:var(--tinta)" font-weight="600">${v[i]}</text><text x="${p[0]}" y="${H-8}" font-size="10" text-anchor="middle" fill="#8e8e93">${f[i]}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="legend">${bands.map(b=>`<span><i style="background:${b[2]};opacity:1"></i>${b[3]} (${b[0]}–${b[1]})</span>`).join('')}</div>`;
}

function setTheme(t){theme=t;document.documentElement.dataset.theme=t}
function toggleTheme(){setTheme(theme=='dark'?'light':'dark');render()}
function togglePriv(){priv=!priv;render()}
function maskNames(){
 if(!priv)return;
 const names=[...new Set(PAC.flatMap(p=>[p.n,p.n.split(' ')[0]]))].sort((a,b)=>b.length-a.length);
 const src=names.join('|'),reT=new RegExp(src),reG=new RegExp('('+src+')','g');
 ['#main','#apl','#modal'].forEach(sel=>{const root=$(sel);if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const par=n.parentNode;if(!par||/^(SCRIPT|STYLE|TEXTAREA|OPTION)$/.test(par.tagName)||!reT.test(n.nodeValue))return;const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(reG,'<span class="pn">$1</span>');n.replaceWith(sp)})});
}
function lockNow(){pin='';lockRender();$('#lock').classList.add('on')}
function lockRender(){
 const logo=document.querySelector('.brand img').src;
 $('#lock').innerHTML=`<div class="lk"><img src="${logo}" alt=""><h2>Atrium · Consulta</h2><p class="sub">Escribe tu PIN</p><div class="pdots">${[0,1,2,3].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="lockKey('${k}')">${k}</button>`).join('')}</div><p class="sub" style="font-size:12px;margin-top:14px">PIN de ejemplo: 1234</p></div>`;
}
function lockKey(k){
 if(k=='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;
 lockRender();
 if(pin.length==4){if(pin=='1234'){$('#lock').classList.remove('on');pin=''}else{const d=document.querySelector('.pdots');d.classList.add('shake');setTimeout(()=>{pin='';lockRender()},450)}}
}
function resetIdle(){clearTimeout(idleT);idleT=setTimeout(lockNow,300000)}
['pointerdown','keydown','scroll'].forEach(e=>addEventListener(e,resetIdle,{passive:true}));

function sugerencias(){
 const TH={gad7:10,phq9:10,cesd:16,pcl5:31},o=[];
 PAC.forEach(p=>{const g={};p.res.forEach(r=>(g[r.id]=g[r.id]||[]).push(r));
  Object.keys(g).forEach(id=>{const a=g[id],l=a[a.length-1],pr=a[a.length-2];
   if(TH[id]&&l.s>=TH[id])o.push([`Reaplicar ${l.t} en 2–4 semanas`,`${p.n} · ${l.s} pts (${l.nivel})`]);
   if(pr&&Math.abs(l.s-pr.s)>=5)o.push([`Cambio notable en ${l.t}`,`${p.n} · ${pr.s} → ${l.s}`])})});
 return o.slice(0,5);
}

function pistas(p){
 const last={};p.res.forEach(r=>last[r.id]=r);const o=[];
 if(last.gad7&&last.gad7.s>=10)o.push(['GAD-7 '+last.gad7.s+' pts','Explorar trastornos de ansiedad (CIE-11: 6B00 y afines)']);
 if(last.phq9&&last.phq9.s>=10)o.push(['PHQ-9 '+last.phq9.s+' pts','Explorar trastornos depresivos (CIE-11: 6A70–6A73)']);
 if(last.cesd&&last.cesd.s>=16)o.push(['CES-D '+last.cesd.s+' pts','Explorar trastornos depresivos (CIE-11: 6A70–6A73)']);
 if(last.pcl5&&last.pcl5.s>=31)o.push(['PCL-5 '+last.pcl5.s+' pts','Explorar TEPT (CIE-11: 6B40)']);
 if(last.asrs18&&last.asrs18.det[0][1]>=4)o.push(['ASRS Parte A positiva','Explorar TDAH en adulto (CIE-11: 6A05)']);
 return o;
}

let REC=null;
function dictar(id){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Usa el micrófono del teclado');return}
 if(REC){REC.stop();REC=null;return}
 REC=new SR();REC.lang='es-MX';REC.interimResults=false;REC.continuous=true;
 REC.onresult=e=>{const t=[...e.results].slice(e.resultIndex).map(r=>r[0].transcript).join(' ');const el=document.getElementById(id);el.value+=(el.value?' ':'')+t.trim()};
 REC.onend=()=>{REC=null;document.querySelectorAll('.mic').forEach(m=>m.classList.remove('rec'))};
 document.querySelector(`[onclick="dictar('${id}')"]`).classList.add('rec');REC.start();
}
function guardarNota(){
 const p=PAC.find(x=>x.id==$('#nt-p').value),f=$('#nt-f').value;
 const txt=NOTA_F[f].map((l,i)=>{const v=($('#nf'+i).value||'').trim();return v?(f=='Libre'?esc(v):`<b>${l}:</b> ${esc(v)}`):''}).filter(Boolean).join('<br>');
 if(txt){p.n_ses++;p.notas.unshift(['26 oct · Sesión '+p.n_ses,txt])}

function estado(m,err){const s=$('#sv');if(!s)return;s.textContent=m;s.className='on'+(err?' err':'');if(!err){clearTimeout(estado.t);estado.t=setTimeout(()=>s.className='',1800)}}

 if(!API)return;
 estado('Guardando…');
 saveQ=saveQ.then(()=>new Promise(res=>{
  API.withSuccessHandler(()=>{fallidos=fallidos.filter(f=>!(f[0]==col&&f[1].id==obj.id));estado(fallidos.length?'Hay cambios sin guardar · toca para reintentar':'Guardado ✓',!!fallidos.length);res()})
   .withFailureHandler(e=>{if(!fallidos.some(f=>f[0]==col&&f[1].id==obj.id))fallidos.push([col,obj]);estado('No se guardó · toca para reintentar',true);res()})
   .apiSave(col,JSON.stringify(obj))}));
}

/* ---- modelo ---- */
function hid(p){
 ['gad','fechas'].forEach(k=>delete p[k]);
 p.tareas=p.tareas||[];p.notas=(p.notas||[]).filter(n=>n&&n[0]!=='—');p.res=p.res||[];p.obj=p.obj||[];p.hc=p.hc||null;p.cons=p.cons||null;
 p.tel=p.tel||'';p.mail=p.mail||'';p.mot=p.mot||'Por definir';p.desde=p.desde||corto();
 if(typeof p.n_ses==='number'&&p.sesPrev===undefined)p.sesPrev=Math.max(0,p.n_ses-p.notas.length);
 const def=(k,g)=>Object.defineProperty(p,k,{get:g,enumerable:false,configurable:true});
 def('ini',()=>(p.n||'?').trim()[0].toUpperCase());
 def('n_ses',()=>p.notas.length+(p.sesPrev||0));
 def('prox',()=>{const c=proxCita(p.id);if(!c)return '—';const d=fromISO(c.fecha);return `${DIAS[d.getDay()].slice(0,3)} ${d.getDate()} ${MES[d.getMonth()]} · ${c.hora}`});
 return p;
}
const byHora=(a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora);

const citasDe=f=>CIT.filter(c=>c.fecha==f).sort(byHora);

function falloCarga(m){const l=document.getElementById('loader');if(!l)return;l.innerHTML=`<div class="lk"><h2>No se pudo abrir</h2><p class="sub" style="white-space:pre-wrap;word-break:break-word;max-width:340px;text-align:left;font-size:12.5px">${String(m).replace(/</g,'&lt;')}</p><p class="sub" style="font-size:11.5px">Versión ${APP_VER}</p><button class="btn" style="margin-top:14px" onclick="location.reload()">Reintentar</button></div>`}
window.addEventListener('error',e=>{if(document.getElementById('loader'))falloCarga((e.message||'Error')+(e.lineno?' (línea '+e.lineno+')':''))});

  $('#loader').innerHTML=`<div class="lk"><h2>No se pudieron cargar los datos</h2><p class="sub">${esc((e&&e.message)||e)}</p><button class="btn" style="margin-top:14px" onclick="location.reload()">Reintentar</button></div>`}).apiLoad();
}

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t+'|atrium'));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of t+'|atrium')h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}
function lockNow(){if(!CFG.pinHash){toast('Primero define un PIN en Ajustes');modal('ajustes');return}pin='';lockRender();$('#lock').classList.add('on')}
async function lockKey(k){
 if(k=='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;
 lockRender();
 if(pin.length==4){const h=await sha(pin);if(h==CFG.pinHash){$('#lock').classList.remove('on');pin=''}else{const d=document.querySelector('.pdots');d.classList.add('shake');setTimeout(()=>{pin='';lockRender()},450)}}
}

}

const BLQ=[];
const BL_PRE=['Ausente','Comida','Cena','Trámite personal','Cita personal','Vacaciones','Supervisión'];
const mn=h=>{const [a,b]=(h||'0:0').split(':').map(Number);return a*60+b};
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const bloqDe=f=>BLQ.filter(b=>b.fecha==f).sort((a,b)=>(a.todoDia?'00:00':a.hora).localeCompare(b.todoDia?'00:00':b.hora));
const saveBloq=b=>{persist('bloqueos',b);calSync(b,'bloq')};
function choque(f,hora,dur,soloCitas){
 const a=mn(hora),b=a+dur,out=[];
 if(!soloCitas)BLQ.filter(x=>x.fecha==f).forEach(x=>{if(x.todoDia||(a<mn(x.hora)+x.dur&&mn(x.hora)<b))out.push(x.titulo)});
 CIT.filter(c=>c.fecha==f&&c.estado!='Cancelada'&&a<mn(c.hora)+(c.dur||50)&&mn(c.hora)<b).forEach(c=>out.push('cita con '+nom(c)));
 return out;
}
function bloqStrip(f){
 const l=bloqDe(f);if(!l.length)return '';
 return l.map(b=>`<div class="bloq"><span class="bt">${b.todoDia?'Todo el día':b.hora+'–'+hm(mn(b.hora)+b.dur)}</span><b>${esc(b.titulo)}</b><span class="bx">${b.gid?`<button class="btn ghost sm" onclick="delBloq(${b.id},true)">Quitar serie</button>`:''}<button class="btn ghost sm" onclick="delBloq(${b.id})">Quitar</button></span></div>`).join('');
}
function delBloq(id,serie){
 const b=BLQ.find(x=>x.id==id);if(!b)return;
 if(serie&&!confirm('¿Quitar todos los bloqueos de esta serie?'))return;
 const lista=serie?BLQ.filter(x=>x.gid==b.gid):[b];
 lista.forEach(x=>{BLQ.splice(BLQ.indexOf(x),1);x._del=true;calSync(x,'bloq');if(API)API.apiDelete('bloqueos',x.id)});
 render();toast(lista.length>1?'Serie quitada':'Bloqueo quitado');
}

 <label>¿Qué es?</label><input class="f" id="bl-t" placeholder="Ej. Comida" value="Ausente">
 <div class="chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${BL_PRE.map(x=>`<button type="button" class="btn ghost sm" onclick="document.getElementById('bl-t').value='${x}'">${x}</button>`).join('')}</div>
 <label>Fecha</label><input class="f" id="bl-f" type="date" value="${fecha||selDate}">
 <label style="text-transform:none;display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="bl-td" onchange="document.getElementById('bl-hh').style.display=this.checked?'none':'flex'"> Todo el día</label>
 <div id="bl-hh" style="display:flex;gap:10px"><div style="flex:1"><label>Desde</label><input class="f" id="bl-i" type="time" value="14:00"></div><div style="flex:1"><label>Hasta</label><input class="f" id="bl-e" type="time" value="15:00"></div></div>
 <label>Repetir</label><div style="display:flex;gap:10px"><select class="f" id="bl-r" style="flex:2"><option value="no">No repetir</option><option value="sem">Cada semana</option><option value="lab">De lunes a viernes</option></select><input class="f" id="bl-n" type="number" min="1" max="52" value="4" style="flex:1" title="Semanas"></div><p class="sub" style="font-size:12px;margin-top:6px">El número es cuántas semanas se repite.</p>
 <div class="row"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn" onclick="guardarBloq()">Bloquear</button></div>`;
 $('#ov').classList.add('on');
}
function guardarBloq(){
 const titulo=$('#bl-t').value.trim(),fecha=$('#bl-f').value,td=$('#bl-td').checked,hi=$('#bl-i').value,he=$('#bl-e').value,rep=$('#bl-r').value,n=Math.max(1,Math.min(52,+$('#bl-n').value||1));
 if(!titulo||!fecha){toast('Falta el nombre o la fecha',true);return}
 if(!td&&(!hi||!he||mn(he)<=mn(hi))){toast('La hora final debe ser después de la inicial',true);return}
 const dur=td?1440:mn(he)-mn(hi),fechas=[];
 if(rep=='no')fechas.push(fecha);
 else if(rep=='sem')for(let i=0;i<n;i++){const d=fromISO(fecha);d.setDate(d.getDate()+7*i);fechas.push(iso(d))}
 else for(let i=0;i<n*7;i++){const d=fromISO(fecha);d.setDate(d.getDate()+i);if(d.getDay()>0&&d.getDay()<6)fechas.push(iso(d))}
 const ch=[];if(!td)fechas.forEach(f=>{const c=choque(f,hi,dur,true);if(c.length)ch.push(f+': '+c.join(', '))});
 if(ch.length&&!confirm('Se cruza con:\n'+ch.slice(0,5).join('\n')+'\n¿Bloquear de todos modos?'))return;
 const gid=fechas.length>1?nuevoId():null;
 fechas.forEach((f,i)=>{const b={id:nuevoId()+i,titulo,fecha:f,hora:td?'00:00':hi,dur,todoDia:td};if(gid)b.gid=gid;BLQ.push(b);saveBloq(b)});
 selDate=fecha;const d0=fromISO(fecha);calY=d0.getFullYear();calM=d0.getMonth();
 closeM();render();toast(fechas.length>1?fechas.length+' bloqueos creados':'Horario bloqueado');
}

/* Google Calendar */
let calQ=Promise.resolve(),calAvisado=false;
const iniciales=n=>(n||'').split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()+'.').join('');
function calSync(o,tipo,forzar){
 if(!API||!CFG.cal||CFG.cal=='off')return;
 const esB=tipo=='bloq';
 calQ=calQ.then(()=>new Promise(res=>{
  const borrar=esB?!!o._del:o.estado=='Cancelada';
  const titulo=esB?o.titulo:(CFG.cal=='iniciales'?'Cita · '+iniciales(nom(o)):'Consulta');
  const sig=[titulo,o.fecha,o.hora,o.dur,o.todoDia,borrar].join('|');
  if(!forzar&&o.gsig===sig&&!!o.gcal===!borrar){res();return}
  if(borrar&&!o.gcal){res();return}
  const pay={gcal:o.gcal||'',borrar,titulo,fecha:o.fecha,hora:o.hora,dur:o.dur||50,todoDia:!!o.todoDia,alerta:esB?0:30};
  API.withSuccessHandler(id=>{
   if(borrar){delete o.gcal;delete o.gsig}else{o.gcal=id;o.gsig=sig}
   if(!o._del)persist(esB?'bloqueos':'citas',o);res()
  }).withFailureHandler(e=>{if(!calAvisado){calAvisado=true;toast('No se pudo sincronizar con Google Calendar: '+((e&&e.message)||e),true)}res()}).apiCalSync(JSON.stringify(pay))
 }));
}
function calTodo(){
 const h=hoyISO(),cs=CIT.filter(c=>c.fecha>=h&&c.estado!='Completada'),bs=BLQ.filter(b=>b.fecha>=h);
 if(!CFG.cal||CFG.cal=='off'){toast('Primero elige una opción de sincronización y guarda',true);return}
 cs.forEach(c=>calSync(c,'cita',true));bs.forEach(b=>calSync(b,'bloq',true));
 calQ.then(()=>toast('Google Calendar al día ('+(cs.length+bs.length)+' eventos)'));toast('Enviando a Google Calendar…');
}

function avFicha(p){return `<label class="avBig" title="${p.foto?'Cambiar foto':'Agregar foto'}">${p.foto?`<img src="${p.foto}" alt="">`:SIL}<span class="plus">+</span><input type="file" accept="image/*" hidden onchange="fotoFicha(this,${p.id})"></label>`}
function fotoFicha(el,pid){const f=el.files[0],p=PAC.find(x=>x.id==pid);if(!f||!p)return;reducirImg(f,256,d=>{p.foto=d;savePac(p);render();toast('Foto guardada')})}
fotoPacCarga=function(el){const f=el.files[0];if(!f)return;reducirImg(f,256,d=>{fotoTmp=d;const v=$('#fp-prev');v.src=d;v.style.display='block';$('#fp-sil').style.display='none';$('#fp-quitar').style.display='inline'})};
fotoPacQuitar=function(){fotoTmp='';$('#fp-prev').style.display='none';$('#fp-sil').style.display='block';$('#fp-quitar').style.display='none';const i=document.getElementById('fp-file');if(i)i.value=''};
const _modal3=modal;
modal=function(k,arg){
 const r=_modal3(k,arg);
 if(k=='pac'){
  const old=document.getElementById('fp-prev');
  if(old){const fila=old.closest('div');const lab=fila&&fila.previousElementSibling;if(lab&&lab.tagName=='LABEL')lab.remove();if(fila)fila.remove()}
  const pa=arg&&PAC.find(x=>x.id==arg),h=document.getElementById('np-n');
  if(h){const lab=h.previousElementSibling;(lab&&lab.tagName=='LABEL'?lab:h).insertAdjacentHTML('beforebegin',
   `<div class="fotoSel"><label class="fotoAv" title="Agregar foto"><span id="fp-sil" style="display:${pa&&pa.foto?'none':'block'}">${SIL}</span><img id="fp-prev" alt="" src="${pa&&pa.foto||''}" style="display:${pa&&pa.foto?'block':'none'}"><span class="plus">+</span><input type="file" id="fp-file" accept="image/*" hidden onchange="fotoPacCarga(this)"></label><button type="button" class="linkbtn" id="fp-quitar" onclick="fotoPacQuitar()" style="display:${pa&&pa.foto?'inline':'none'}">Quitar foto</button></div>`)}
 }
 return r;
};
/* ---- registro de asistencias (documento imprimible) ---- */
const ASIS_I=5;DOCT.push('Registro de asistencias');
const D3=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const f2=iso=>{const d=fromISO(iso);return D3[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)};
const f4=iso=>{const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y};
const h12=h=>{const [a,b]=(h||'0:0').split(':').map(Number);return (a%12||12)+':'+pad(b)+' '+(a>=12?'pm':'am')};
function asisFilas(p){
 return CIT.filter(c=>c.pid==p.id&&(c.estado=='Completada'||c.estado=='Cancelada')).sort(byHora).map(c=>{
  const g=PAG.find(x=>(c.pagoId&&x.id==c.pagoId)||x.cita==c.id);
  return {c,est:c.estado=='Completada'?'Asistió':'Canceló',pago:g?(g.e=='Pagado'?'Pagado':'Pendiente'):'—'};
 });
}
function asistHTML(p){
 const F=asisFilas(p),as=F.filter(x=>x.c.estado=='Completada'),pend=PAG.filter(x=>x.p==p.id&&x.e=='Pendiente').length;
 const ini=F.length?f4(F[0].c.fecha):esc(p.desde||''),ult=as.length?f4(as[as.length-1].c.fecha):'—';
 const n=Math.max(20,F.length+5);let rows='';
 for(let i=0;i<n;i++){const x=F[i];
  rows+=x?`<tr><td class="n">${i+1}</td><td>${f2(x.c.fecha)}</td><td>${h12(x.c.hora)}</td><td>${x.est}</td><td>${x.pago}</td><td class="nt" contenteditable="true" onblur="asisNota(${x.c.id},this)">${esc(x.c.nota||'')}</td></tr>`
   :`<tr><td class="n">${i+1}</td><td></td><td></td><td></td><td></td><td></td></tr>`}
 return `<div class="ah"><div class="alogo"><img src="${document.querySelector('.brand img').src}" alt=""><small>${esc(CFG.negocio)}</small></div><div><h2>Registro de Asistencias</h2><small>Control de sesiones y pagos</small></div></div>
 <table class="info"><tr><td>Paciente: <b>${esc(p.n)}</b></td><td>Inicio de proceso: ${ini}</td></tr><tr><td>Responsable / Tutor: ${esc(p.tutor||'')}</td><td>Teléfono: ${esc(p.tel&&p.tel!='—'?p.tel:'')}</td></tr></table>
 <div class="sum"><span>Sesiones asistidas: <b>${as.length}</b></span><span>Pagos: <b>${pend?pend+' pendiente'+(pend>1?'s':''):'Al corriente'}</b></span><span>Última sesión: <b>${ult}</b></span></div>
 <table class="reg"><thead><tr><th>#</th><th>Fecha</th><th>Hora</th><th>Estatus</th><th>Pago</th><th>Notas</th></tr></thead><tbody>${rows}</tbody></table>
 <p class="noprint" style="font-size:12px;color:#8a8a90;margin-top:10px">Se llena sola con las sesiones completadas y canceladas. Toca una celda de «Notas» para escribir; se guarda al salir de la celda.</p>`;
}
function asisNota(id,el){const c=CIT.find(x=>x.id==id);if(!c)return;const t=el.textContent.trim();if((c.nota||'')===t)return;c.nota=t;saveCita(c)}
const _vDoc=vDoc;
vDoc=function(){
 let h=_vDoc();
 if(docSel===ASIS_I){const p=PAC.find(x=>x.id==docPac)||activos()[0];if(p)h=h.replace(/<div class="paper">[\s\S]*<\/div><\/div>$/,()=>'<div class="paper asis">'+asistHTML(p)+'</div></div>')}
 return h;
};


/* ---- impresión (vía vista previa, para que no salga en blanco) ---- */
function imprimirDoc(){
 const el=document.querySelector('#main .paper');if(!el){window.print();return}
 const c=el.cloneNode(true);c.querySelectorAll('.noprint').forEach(x=>x.remove());c.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
 imprimirHTML(`<div class="${c.className}">${c.innerHTML}</div>`);
 setTimeout(()=>window.print(),350);
}
function imprimirHistoria(){
 const p=PAC.find(x=>x.id==pacSel);if(!p)return;
 imprimirHTML(`<div class="paper">${membrete()}<p style="text-align:center;font-weight:700;letter-spacing:.08em;margin:18px 0">HISTORIA CLÍNICA</p><p><b>Paciente:</b> ${esc(p.n)}</p>${HC_CAMPOS.map(([k,l])=>`<p><b>${l}.</b><br>${esc((p.hc&&p.hc[k])||'—')}</p>`).join('')}${firmaHTML()}</div>`);
 setTimeout(()=>window.print(),350);
}

if(!DEMO){document.querySelector('.banner').remove();document.body.classList.add('real')}
cargar(()=>{setTheme(CFG.tema=='dark'?'dark':CFG.tema=='light'?'light':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));const l=$('#loader');if(l)l.remove();resetIdle();applyLogo();render();guiaInicio()});


if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
